resources:
  - id: seed
    name: Local seed curation
    category: curation
    access: local
    url: docs/dictionaries.md
    version: repo-local
    license: project
    use: runtime_seed
    local_files:
      - role: seed_dictionary
        path: data/dictionaries/seed_concepts.jsonl
        required: true
      - role: vietnamese_alias_table
        path: data/dictionaries/vietnamese_medical_alias.jsonl
        required: true
    notes: Hand-curated bootstrap rows maintained in this repository.
  - id: vn_clinical_lexicon_reviewed_2026_07_05
    name: Reviewed Vietnamese clinical LOCAL lexicon
    category: curation
    access: local_reviewed
    url: docs/dictionaries.md
    version: reviewed snapshot 2026-07-05
    release_date: "2026-07-05"
    license: project
    use: reviewed_vietnamese_symptom_lab_procedure_aliases
    local_files:
      - role: raw_reviewed_terms_tsv
        path: data/standards/vn_clinical_lexicon/raw/reviewed_terms.tsv
        required: true
      - role: concept_rows_jsonl
        path: data/standards/vn_clinical_lexicon/processed/vn_clinical_lexicon_concepts.jsonl
        required: true
      - role: import_manifest
        path: data/standards/vn_clinical_lexicon/processed/vn_clinical_lexicon_import_manifest.json
        required: true
    notes: Source-backed local curation for Vietnamese symptoms, lab names, and future procedure terms.
  - id: phase1_reviewed_standard_allowlist_2026_07_06
    name: Reviewed Phase 1 standard concept allowlist
    category: curation
    access: local_reviewed
    url: docs/dictionaries.md
    version: reviewed snapshot 2026-07-06
    release_date: "2026-07-06"
    license: project
    use: controlled_phase1_standard_exception_allowlist
    local_files:
      - role: reviewed_allowlist_tsv
        path: data/standards/phase1_reviewed/allowed_standard_concepts.tsv
        required: true
    notes: Exact-match standard concept exceptions for conservative runtime merge guards; every row requires manual review.
  - id: icd10_vn_tt06_2026
    name: ICD-10 tiếng Việt theo TT 06/2026/TT-BYT
    category: terminology
    access: open_official_pdf
    url: https://vanban.chinhphu.vn/?docid=217536&pageid=27160
    version: TT 06/2026/TT-BYT
    issued_date: "2026-04-02"
    effective_date: "2026-07-01"
    download_urls:
      - https://vanban.chinhphu.vn/?docid=217536&pageid=27160
      - https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/4/06-byt-kem.pdf
    license: vietnam_government_document
    use: phase1_icd10_vietnamese_primary
    local_files:
      - role: raw_pdf
        path: data/standards/icd10_vn/raw/06-byt-kem.pdf
        required: true
      - role: pdftotext_tsv
        path: data/standards/icd10_vn/processed/06-byt-kem.tsv
        required: true
      - role: extracted_rows_jsonl
        path: data/standards/icd10_vn/processed/tt06_icd10_extract.jsonl
        required: true
      - role: concept_rows_jsonl
        path: data/standards/icd10_vn/processed/tt06_icd10_concepts.jsonl
        required: true
    notes: Primary ICD source for Viettel Phase 1; use reviewed structured extracts of 06-byt-kem.pdf.
  - id: cdc_icd10cm_2026
    name: CDC ICD-10-CM FY 2026 files
    category: terminology
    access: open
    url: https://www.cdc.gov/nchs/icd/icd-10-cm/files.html
    version: FY 2026 April 1 update
    release_date: "2026-04-01"
    download_urls:
      - https://ftp.cdc.gov/pub/Health_Statistics/NCHS/Publications/ICD10CM/2026-update/icd10cm-Code%20Descriptions-April-1-2026.zip
      - https://ftp.cdc.gov/pub/Health_Statistics/NCHS/Publications/ICD10CM/2026-update/icd10cm-April-1-2026-XML.zip
    license: us_government_public_resource
    use: icd10cm_reference_only_not_phase1_primary
    notes: US ICD-10-CM reference only. Do not use as the primary Vietnamese ICD-10 source for Phase 1.
  - id: who_icd10_2019
    name: WHO ICD-10 2019 ClaML and browser
    category: terminology
    access: open
    url: https://icdcdn.who.int/icd10/index.html
    version: "2019"
    release_date: "2019"
    download_urls:
      - https://icdcdn.who.int/icd10/claml/icd102019en.xml.zip
      - https://icdcdn.who.int/icd10/meta/icd102019enMeta.zip
    license: who_terms_apply
    use: icd10_hierarchy_reference_not_vietnamese_primary
    notes: Reference source for ICD hierarchy and stable disease grouping, not the primary Vietnamese label source.
  - id: icd_kcb_vn
    name: Vietnamese ICD-10 lookup
    category: terminology
    access: open_manual_review
    url: https://icd.kcb.vn/
    version: manual-review snapshot 2026-07-04
    release_date: "2026-07-04"
    license: verify_before_bulk_use
    use: vietnamese_icd_labels_tt06_lookup
    notes: Use manually reviewed Vietnamese labels and aliases; align new bulk extracts to TT 06/2026/TT-BYT.
  - id: rxnorm_prescribable_2026_06_01
    name: RxNorm Current Prescribable Content Monthly Release June 1 2026
    category: terminology
    access: open_with_terms
    url: https://www.nlm.nih.gov/research/umls/rxnorm/docs/rxnormfiles.html
    version: "2026-06-01"
    release_date: "2026-06-01"
    download_urls:
      - https://download.nlm.nih.gov/rxnorm/RxNorm_full_prescribe_06012026.zip
    license: nlm_rxnorm_terms
    use: phase1_rxnorm_primary_drug_codes
    local_files:
      - role: raw_zip
        path: data/standards/rxnorm/raw/RxNorm_full_prescribe_06012026.zip
        required: true
      - role: concept_rows_jsonl
        path: data/standards/rxnorm/processed/rxnorm_prescribable_06012026_concepts.jsonl
        required: true
      - role: import_manifest
        path: data/standards/rxnorm/processed/rxnorm_prescribable_06012026_import_manifest.json
        required: true
    notes: Primary RxNorm source for Phase 1 drug candidates; parse RXNCONSO/RXNREL/RXNSAT.
  - id: rxnorm_full_2026_06_01
    name: RxNorm Full Monthly Release June 1 2026
    category: terminology
    access: open_with_terms_or_umls
    url: https://www.nlm.nih.gov/research/umls/rxnorm/docs/rxnormfiles.html
    version: "2026-06-01"
    release_date: "2026-06-01"
    download_urls:
      - https://download.nlm.nih.gov/umls/kss/rxnorm/RxNorm_full_06012026.zip
    license: nlm_rxnorm_terms
    use: phase1_rxnorm_fallback_drug_codes
    local_files:
      - role: raw_zip
        path: data/standards/rxnorm/raw/RxNorm_full_06012026.zip
        required: false
    notes: Fallback coverage when prescribable content misses a legitimate medication mention.
  - id: rxnorm_current
    name: RxNorm current release and RxNav API
    category: terminology
    access: open_with_terms
    url: https://www.nlm.nih.gov/research/umls/rxnorm/docs/rxnormfiles.html
    version: current pointer resolved by locked source_versions.json
    release_date: "2026-06-01"
    license: nlm_rxnorm_terms
    use: rxnorm_generic_current_pointer
    notes: Generic current-release pointer; Phase 1 locked source is June 1 2026 in data/standards/source_versions.json.
  - id: rxnav_rest_2026_07_04
    name: RxNav REST API lookups on 2026-07-04
    category: terminology
    access: open_with_terms
    url: https://rxnav.nlm.nih.gov/RxNormAPIs.html
    version: manual lookup snapshot 2026-07-04
    release_date: "2026-07-04"
    license: nlm_rxnorm_terms
    use: phase1_drug_alias_rxcui_curation
    notes: Manual curation batch for Phase 1 drug mentions found in local input files.
  - id: medlineplus_xml
    name: MedlinePlus Health Topic XML
    category: patient_education_text
    access: open_with_attribution
    url: https://medlineplus.gov/xml.html
    version: local curation snapshot 2026-07-04
    release_date: "2026-07-04"
    license: attribution_required
    use: aliases_public_health_topics
    notes: Use topic titles and also-called terms with attribution to MedlinePlus.gov.
  - id: codiesp_zenodo
    name: CodiEsp corpus
    category: competition_dataset
    access: open
    url: https://zenodo.org/records/3837305
    version: Zenodo record 3837305
    release_date: "2020"
    license: CC-BY-4.0
    use: icd_coding_cases_and_spans
    notes: Spanish clinical cases with ICD10/CIE10 coding and text references.
  - id: synthea
    name: Synthea synthetic patient generator
    category: synthetic_dataset
    access: open
    url: https://github.com/synthetichealth/synthea
    version: upstream-unpinned
    release_date: "2026-07-04"
    license: apache-2.0
    use: synthetic_patient_records
    notes: Synthetic, non-PHI patient records; suitable for pipeline smoke and scale testing.
  - id: negex
    name: NegEx
    category: heuristic_paper
    access: paper_reference
    url: https://pubmed.ncbi.nlm.nih.gov/12123149/
    version: publication 2001
    release_date: "2001"
    license: cite_paper
    use: negation_cue_design
    notes: Source pattern for rule-based negation cue and scope heuristics.
  - id: context_algorithm
    name: ConText assertion algorithm
    category: heuristic_paper
    access: paper_reference
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2757457/
    version: publication 2009
    release_date: "2009"
    license: cite_paper
    use: negation_temporality_experiencer_design
    notes: Source pattern for negation, hypothetical, historical, and experiencer cues.
  - id: i2b2_2010
    name: 2010 i2b2/VA concepts, assertions, and relations challenge
    category: competition_dataset
    access: dua_required
    url: https://n2c2.dbmi.hms.harvard.edu/data-sets
    version: "2010 challenge"
    release_date: "2010"
    license: data_use_agreement
    use: assertion_and_relation_taxonomy
    notes: Do not commit data; adapter should read locally provided files after DUA approval.
  - id: mimic_iv_note
    name: MIMIC-IV-Note
    category: clinical_notes
    access: credentialed
    url: https://physionet.org/content/mimic-iv-note/
    version: credentialed local copy required
    release_date: "2023"
    license: physionet_credentialed_health_data
    use: local_private_evaluation_only
    notes: Do not download or commit; requires credentialed PhysioNet access and training.
  - id: nbme_kaggle
    name: NBME Score Clinical Patient Notes
    category: competition_dataset
    access: platform_terms
    url: https://www.kaggle.com/competitions/nbme-score-clinical-patient-notes
    version: competition snapshot
    release_date: "2022"
    license: kaggle_competition_terms
    use: local_span_extraction_benchmark
    notes: Do not vendor data; adapter should read user-provided local Kaggle files.
