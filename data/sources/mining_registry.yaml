schema_version: medical-source-registry.v2
resources:
  - id: vn_moh_guidelines
    name: Vietnamese Ministry of Health clinical guidelines
    category: vietnamese_guidelines
    version: curated-2026-07
    version_policy: manual_import
    access_class: open_with_terms
    license_id: vietnam_government_document
    license_url: https://moh.gov.vn/
    redistribution: attribution
    hosted_processing_allowed: true
    retention: immutable
    connector: static_http
    parser: vietnamese_guideline
    urls:
      - https://kcb.vn/phac-do.html
    allowed_uses: [terminology_mining, phrase_mining, synthetic_grounding]
    notes: Guidance text is not treated as representative clinical-note distribution.
  - id: vietbioner
    name: VietBioNER
    category: vietnamese_biomedical_ner
    version: git-19ba70a5947d1be72906d407c860b1666b9337e9
    version_policy: pinned
    access_class: open
    license_id: CC-BY-4.0
    license_url: https://github.com/ptpuyen1511/VietBioNER#license
    redistribution: attribution
    hosted_processing_allowed: true
    retention: immutable
    connector: static_http
    parser: brat
    parser_options:
      language: vi
      note_type: biomedical_literature
    urls: [https://github.com/ptpuyen1511/VietBioNER]
    allowed_uses: [entity_training, terminology_mining, external_benchmark]
    notes: Dataset repository license is pinned separately from the LREC paper license.
  - id: vietmed_ner
    name: VietMed-NER
    category: vietnamese_spoken_medical_ner
    version: repository-snapshot
    version_policy: manual_import
    access_class: quarantine
    license_id: verify_dataset_license
    license_url: https://huggingface.co/leduckhai/VietMed-NER
    redistribution: unknown
    hosted_processing_allowed: false
    retention: local_only
    connector: local_archive
    parser: vietmed_ner
    allowed_uses: [license_review]
  - id: phase1_round2_input
    name: Phase 1 Round 2 competition input
    category: local_competition_input
    version: round2-phase1-2026-07-22
    version_policy: pinned
    # The data owner explicitly authorized temporary inference on Vast.ai on 2026-07-27.
    access_class: authorized_private
    license_id: competition_input_restricted
    license_url: local-source://phase1-round2-input/terms
    redistribution: prohibited
    hosted_processing_allowed: true
    retention: local_only
    connector: local_archive
    parser: plain_text_archive
    parser_options:
      language: vi
      note_type: mixed_medical_text
      require_numeric_ids: "true"
      max_members: "1000"
      max_member_bytes: "8388608"
      max_total_uncompressed_bytes: "67108864"
      max_compression_ratio: "200"
    allowed_uses:
      [local_competition_inference, hosted_competition_inference, local_distribution_audit]
    notes: >-
      Raw Round 2 input may be transferred temporarily to owner-authorized Vast.ai compute for
      inference. It is never a training, pseudo-label, redistribution, or runtime-memory source.
  - id: phase1_part2_leaked_bundle
    name: Unverified Phase 1 part 2 annotation bundle
    category: unauthorized_competition_annotation_bundle
    version: sha256-46da2a7718078b95024e97feb66d49e44917d7b00b3981bad3eaaae13adc418e
    version_policy: pinned
    access_class: quarantine
    license_id: organizer_authorization_unverified
    license_url: local-source://phase1-part2-leaked-bundle/authorization
    redistribution: unknown
    hosted_processing_allowed: false
    retention: local_only
    connector: local_archive
    parser: quarantine_audit_only
    allowed_uses: [license_review, aggregate_quarantine_audit]
    notes: >-
      The caller described this bundle as leaked. Labels, spans, aliases, thresholds, and
      document-specific output are prohibited until the organizer supplies explicit authorization.
  - id: pmc_oa
    name: PubMed Central Open Access Subset
    category: case_reports_and_literature
    version: api-snapshot
    version_policy: latest_with_snapshot
    access_class: open_with_terms
    license_id: per_article_license
    license_url: https://pmc.ncbi.nlm.nih.gov/tools/openftlist/
    license_mode: per_artifact
    redistribution: attribution
    hosted_processing_allowed: true
    retention: immutable
    connector: pmc_oa
    parser: pmc_oa
    urls:
      - https://www.ncbi.nlm.nih.gov/pmc/utils/oa/oa.fcgi
      - https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi
    allowed_uses: [rare_case_mining, relation_mining, synthetic_grounding]
    rate_limit_per_second: 3
  - id: dailymed
    name: DailyMed Structured Product Labels
    category: drug_labels
    version: api-v2-snapshot
    version_policy: latest_with_snapshot
    access_class: open_with_terms
    license_id: nlm_dailymed_terms
    license_url: https://dailymed.nlm.nih.gov/dailymed/app-support-web-services.cfm
    redistribution: attribution
    hosted_processing_allowed: true
    retention: immutable
    connector: dailymed
    parser: spl_xml
    urls: [https://dailymed.nlm.nih.gov/dailymed/services/v2/]
    allowed_uses: [drug_span_mining, dosage_relation_mining, adverse_effect_mining]
    rate_limit_per_second: 2
  - id: dailymed_rxnorm_mappings
    name: DailyMed SPL to RxNorm Mappings
    category: drug_terminology_mappings
    version: "2026-07-17"
    version_policy: pinned
    access_class: open_with_terms
    license_id: nlm_dailymed_terms
    license_url: https://dailymed.nlm.nih.gov/dailymed/app-support-mapping-files.cfm
    redistribution: attribution
    hosted_processing_allowed: true
    retention: immutable
    connector: static_http
    parser: dailymed_rxnorm_mapping
    urls: [https://dailymed-data.nlm.nih.gov/public-release-files/rxnorm_mappings.zip]
    allowed_uses: [terminology_linking, dictionary_enrichment, linking_evaluation]
    rate_limit_per_second: 1
  - id: rxnorm_full_2026_07_06
    name: RxNorm Full Monthly Release July 6 2026
    category: drug_terminology
    version: "2026-07-06"
    version_policy: pinned
    access_class: credentialled
    license_id: nlm_rxnorm_terms
    license_url: https://www.nlm.nih.gov/research/umls/rxnorm/docs/rxnormfiles.html
    redistribution: attribution
    hosted_processing_allowed: false
    retention: immutable
    connector: local_archive
    # Parsing RRF into concepts is owned by the terminology importer; this mining lane
    # only gives the licensed source archive a portable, content-addressed identity.
    parser: rxnorm_rrf
    urls:
      - https://download.nlm.nih.gov/umls/kss/rxnorm/RxNorm_full_07062026.zip
    allowed_uses: [terminology_linking, dictionary_enrichment, linking_evaluation]
    credentials: [accepted NLM RxNorm/UMLS terms and local archive]
    notes: The caller supplies RXNORM_FULL_ARCHIVE; hosted processing is disabled.
  - id: clinicaltrials_v2
    name: ClinicalTrials.gov API v2
    category: clinical_trials
    version: api-v2-snapshot
    version_policy: latest_with_snapshot
    access_class: open
    license_id: us_government_public_resource
    license_url: https://clinicaltrials.gov/data-api
    redistribution: allowed
    hosted_processing_allowed: true
    retention: immutable
    connector: clinicaltrials
    parser: clinicaltrials_json
    urls: [https://clinicaltrials.gov/api/v2/]
    allowed_uses: [condition_intervention_relation_mining, terminology_mining]
    rate_limit_per_second: 3
  - id: loinc_2_82
    name: LOINC 2.82
    category: terminology
    version: "2.82"
    version_policy: pinned
    access_class: open_with_terms
    license_id: loinc-license-5.8
    license_url: https://loinc.org/license/
    redistribution: attribution
    hosted_processing_allowed: true
    retention: immutable
    connector: local_archive
    parser: loinc_release
    credentials: [LOINC account and accepted terms]
    allowed_uses: [lab_terminology, lab_result_grounding]
  - id: mondo
    name: Mondo Disease Ontology
    category: rare_disease_ontology
    version: "2026-07-06"
    version_policy: pinned
    access_class: open
    license_id: CC-BY-4.0
    license_url: https://mondo.monarchinitiative.org/pages/download/
    redistribution: attribution
    hosted_processing_allowed: true
    retention: immutable
    connector: static_http
    parser: obo_json
    urls:
      - https://github.com/monarch-initiative/mondo/releases/download/v2026-07-06/mondo.json
      - https://github.com/monarch-initiative/mondo/releases/download/v2026-07-06/source-versions.tsv
    allowed_uses: [rare_disease_coverage, ontology_relations]
  - id: hpo
    name: Human Phenotype Ontology and annotations
    category: phenotype_ontology
    version: "2026-06-23"
    version_policy: pinned
    access_class: open_with_terms
    license_id: hpo-source-terms
    license_url: https://hpo.jax.org/app/license
    redistribution: attribution
    hosted_processing_allowed: true
    retention: immutable
    connector: static_http
    parser: hpo_release
    urls:
      - https://github.com/obophenotype/human-phenotype-ontology/releases/download/v2026-06-23/hp.json
      - https://github.com/obophenotype/human-phenotype-ontology/releases/download/v2026-06-23/phenotype.hpoa
      - https://github.com/obophenotype/human-phenotype-ontology/releases/download/v2026-06-23/genes_to_disease.txt
    allowed_uses: [phenotype_coverage, disease_phenotype_relations]
  - id: codiesp
    name: CodiEsp corpus
    category: clinical_coding_corpus
    version: zenodo-3837305
    version_policy: pinned
    access_class: open
    license_id: CC-BY-4.0
    license_url: https://zenodo.org/records/3837305
    redistribution: attribution
    hosted_processing_allowed: true
    retention: immutable
    connector: static_http
    parser: codiesp
    urls: [https://zenodo.org/records/3837305/files/codiesp.zip]
    allowed_uses: [cross_lingual_ner, icd_linking]
  - id: biored
    name: BioRED
    category: biomedical_relation_corpus
    version: repository-snapshot
    version_policy: manual_import
    access_class: quarantine
    license_id: verify_dataset_license
    license_url: https://github.com/ncbi/BioRED
    redistribution: unknown
    hosted_processing_allowed: false
    retention: local_only
    connector: local_archive
    parser: bioc
    allowed_uses: [license_review]
  - id: synthea
    name: Synthea synthetic patient generator
    category: synthetic_ehr
    version: pinned-commit-required
    version_policy: manual_import
    access_class: open
    license_id: Apache-2.0
    license_url: https://github.com/synthetichealth/synthea/blob/master/LICENSE
    redistribution: allowed
    hosted_processing_allowed: true
    retention: immutable
    connector: local_archive
    parser: fhir_bundle
    allowed_uses: [structured_scenario_generation, relation_mining, scale_testing]
  - id: mimic_iv_note
    name: MIMIC-IV-Note
    category: clinical_notes
    version: "2.2"
    version_policy: pinned
    access_class: dua
    license_id: physionet-credentialed-health-data-1.5.0
    license_url: https://physionet.org/content/mimic-iv-note/view-dua/2.2/
    redistribution: prohibited
    hosted_processing_allowed: false
    retention: local_only
    connector: local_archive
    parser: mimic_iv_note
    credentials: [PhysioNet credential, CITI training, signed DUA]
    allowed_uses: [local_private_training, source_heldout_evaluation]
  - id: n2c2_i2b2
    name: n2c2 and i2b2 clinical NLP corpora
    category: clinical_nlp_challenges
    version: approved-local-snapshot
    version_policy: manual_import
    access_class: dua
    license_id: dataset_specific_dua
    license_url: https://portal.dbmi.hms.harvard.edu/projects/n2c2-nlp/
    redistribution: prohibited
    hosted_processing_allowed: false
    retention: local_only
    connector: local_archive
    parser: n2c2
    credentials: [approved dataset access]
    allowed_uses: [local_assertion_training, local_relation_training]
