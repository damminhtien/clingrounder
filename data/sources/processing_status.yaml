  - source_id: vietmed_ner
    state: curated
    promotion_boundary: training_only
    dossier: docs/mining-sources/vietmed-ner.md
    verified_on: 2026-07-27
    summary: >-
      Owner-confirmed use permits pinned training and model inference. Text/BIO columns from all
      official splits are materialized with exact offsets; source bytes remain non-redistributable.
      Broad source labels may train or verify proposals but cannot enter Phase 1 output directly.
    run_configs:
      - configs/mining/vietmed_ner.yaml
      - configs/mining/labelers/vietmed_ner.yaml
    artifact_roots:
      - outputs/mining/vietmed-ner-e3d0393c
      - outputs/mining/model-datasets/vietmed-ner-e3d0393c-18type
      - outputs/mining/model-datasets/vietmed-ner-qwen-exact-quote-v1
  - source_id: phase1_round2_input
    state: acquired
    promotion_boundary: none
    dossier: docs/mining-sources/phase1-round2.md
    verified_on: 2026-07-22
    summary: >-
      The private 100-document archive is checksum-pinned and byte-preserving; derived profile,
      duplicate, and novelty reports are audit-only and cannot supply labels or runtime memory.
      The owner authorized temporary Vast.ai inference on 2026-07-27; redistribution, training,
      pseudo-labeling, and hosted artifact retention remain prohibited.
    run_configs:
      - configs/mining/phase1-round2-2026-07-22.yaml
      - configs/mining/phase1-round2-hosted-2026-07-27.yaml
    artifact_roots:
      - outputs/mining/phase1-round2-2026-07-22
      - outputs/mining/phase1-round2-hosted-2026-07-27
  - source_id: phase1_manual_gold
    state: curated
    promotion_boundary: training_only
    dossier: docs/mining-sources/phase1-manual-gold.md
    verified_on: 2026-08-03
    summary: >-
      One hundred reviewed annotations are retained locally for benchmark reproduction and model
      diagnostics. Their content is excluded from public Git and fingerprinted by the public local
      artifact inventory.
    artifact_roots:
      - data/manual_gold
  - source_id: phase1_part2_leaked_bundle
    state: acquired
    promotion_boundary: training_only
    dossier: docs/mining-sources/phase1-part2-authorized-training.md
    verified_on: 2026-07-30
    summary: >-
      The owner authorized the checksum-pinned labels for supervised training. The importer must
      materialize LF child documents before applying offsets. Raw bytes remain private, and the
      source is not a document-specific runtime memory or direct submission seed.
    run_configs:
      - configs/models/phase1-training-governance-2026-07-30.yaml
