boundary_rules:
  global:
    exclude_leading_context:
    - được chẩn đoán
    - tiền sử
    - phủ nhận
    - không có
    stop_at:
    - ;
    - '

      '
    split_coordinated_mentions: true
    prefer_non_overlapping_concepts: true
  CHẨN_ĐOÁN:
    include_attached_modifiers:
    - subtype
    - site
    - laterality
    - severity
    - chronicity
    keep_lexical_modifiers:
    - không đặc hiệu
    - không ổn định
    - không biến chứng
    exclude:
    - generic lesion
    - coreference
    - procedure wrapper
  THUỐC:
    include_attached_modifiers:
    - strength
    - dose form
    - route
    - frequency
    stop_before:
    - indication
    - treatment verb
    - unrelated temporal clause
  TRIỆU_CHỨNG:
    include_attached_modifiers:
    - body site
    - laterality
    - severity
    positive_inability_phrases: true
    exclude:
    - anatomy only
    - normal state
    - generic symptom group
  TÊN_XÉT_NGHIỆM:
    include_attached_modifiers:
    - modality
    - body site
    - contrast
    - diagnostic target
    exclude:
    - treatment procedure
    - generic evaluation
    - result value
  KẾT_QUẢ_XÉT_NGHIỆM:
    include_attached_modifiers:
    - unit
    - qualifier
    - descriptive finding
    require_test_or_vital_anchor: true
    exclude:
    - test name
    - date
    - dose
    - age
    - administrative number
