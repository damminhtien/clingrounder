name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to release"
        required: true
        type: string

permissions:
  contents: read

env:
  UV_VERSION: "0.11.31"
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # INVARIANT: manual releases must build the requested tag, not the default branch.
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install locked release environment
        run: |
          python -m pip install "uv==$UV_VERSION" twine
          uv sync --frozen --extra dev --extra data --python "$pythonLocation/bin/python"

      - name: Verify tag matches project version
        shell: bash
        run: |
          PROJECT_VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )
          test "$RELEASE_TAG" = "v${PROJECT_VERSION}"

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Mypy
        run: .venv/bin/mypy src

      - name: Public and release tests
        run: .venv/bin/pytest -o addopts='' -m "not private and not model and not benchmark" tests

      - name: Public repository audit
        run: .venv/bin/clingrounder release audit --root .

      - name: Build release artifacts
        run: uv build --wheel --sdist --out-dir dist

      - name: Validate release metadata
        run: twine check dist/*

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/clingrounder-wheel-smoke
          /tmp/clingrounder-wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/clingrounder-wheel-smoke/bin/python scripts/smoke_test_installed_wheel.py

      - name: Extract release notes
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          python - "$VERSION" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text().splitlines()
          heading = f"## [{version}]"
          try:
              start = next(i for i, line in enumerate(lines) if line.startswith(heading)) + 1
          except StopIteration as error:
              raise SystemExit(f"Missing changelog section: {heading}") from error
          end = next((i for i in range(start, len(lines)) if lines[i].startswith("## [")), len(lines))
          notes = "\n".join(lines[start:end]).strip()
          if not notes:
              raise SystemExit("Release notes section is empty")
          Path("release-notes.md").write_text(notes + "\n")
          PY

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/clingrounder
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-assets

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PRERELEASE_ARGS=()
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refreshing assets."
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "ClinGrounder $VERSION" \
              --notes-file release-notes.md \
              "${PRERELEASE_ARGS[@]}"
          fi
