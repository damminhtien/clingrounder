name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  UV_VERSION: "0.11.31"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --extra dev --extra data --python "$pythonLocation/bin/python"

      - name: Ruff
        run: uv run --frozen ruff check .

      - name: Mypy
        run: uv run --frozen mypy src

      - name: Pytest
        run: uv run --frozen pytest tests

      - name: Pipeline smoke
        run: |
          uv run --frozen medical-kg pipeline run \
            --input data/samples/sample_notes.jsonl \
            --output outputs/predictions.jsonl
          uv run --frozen medical-kg validate \
            --profile development \
            --pred outputs/predictions.jsonl \
            --documents data/samples/sample_notes.jsonl \
            --dictionary data/dictionaries/seed_concepts.jsonl
