name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  UV_VERSION: "0.11.31"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --extra dev --extra data --python "$pythonLocation/bin/python"

      - name: Ruff
        # INVARIANT: Execute the environment synced above. `uv run` would
        # re-read the repository's local .python-version and replace the
        # matrix interpreter.
        run: .venv/bin/ruff check .

      - name: Mypy
        run: .venv/bin/mypy src

      - name: Pytest
        run: .venv/bin/pytest tests

      - name: Pipeline smoke
        run: |
          .venv/bin/clingrounder pipeline run \
            --config configs/pipeline/clinical-baseline.yaml \
            --input data/samples/sample_notes.jsonl \
            --output outputs/predictions.jsonl
          .venv/bin/clingrounder validate \
            --profile development \
            --pred outputs/predictions.jsonl \
            --documents data/samples/sample_notes.jsonl \
            --dictionary data/dictionaries/seed_concepts.jsonl

  release-contract:
    name: Release and integration contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install locked environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --extra dev --extra data --python "$pythonLocation/bin/python"

      - name: Release and integration tests
        # These exercise SQLite, process workers, reports, and deterministic artifacts.
        run: .venv/bin/pytest -o addopts='' -m "(integration or release) and not private and not model" tests

      - name: Public repository audit
        run: .venv/bin/clingrounder release audit --root .

  public-benchmark:
    name: Public product benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install locked environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --extra dev --extra data --python "$pythonLocation/bin/python"

      - name: Audit public benchmark dataset
        run: |
          mkdir -p artifacts/benchmarks/vi-clinical-grounding-v1
          .venv/bin/clingrounder-benchmark audit \
            --benchmark benchmarks/vi_clinical_grounding_v1 \
            --output artifacts/benchmarks/vi-clinical-grounding-v1/audit.json

      - name: Run measured benchmark suite
        run: |
          .venv/bin/clingrounder-benchmark suite \
            --benchmark benchmarks/vi_clinical_grounding_v1 \
            --config exact=configs/benchmarks/vi_clinical_grounding_v1/exact.yaml \
            --config lexical=configs/benchmarks/vi_clinical_grounding_v1/lexical.yaml \
            --config hybrid=configs/benchmarks/vi_clinical_grounding_v1/hybrid.yaml \
            --config full=configs/benchmarks/vi_clinical_grounding_v1/full.yaml \
            --output artifacts/benchmarks/vi-clinical-grounding-v1/suite

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-benchmark-${{ github.sha }}
          path: artifacts/benchmarks/vi-clinical-grounding-v1
          if-no-files-found: error

  security-artifacts:
    name: Dependency, secret, and SBOM artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install locked environment and scanners
        run: |
          python -m pip install "uv==$UV_VERSION" pip-audit cyclonedx-bom detect-secrets
          uv sync --frozen --extra dev --extra data --python "$pythonLocation/bin/python"

      - name: Prepare security artifact directory
        run: mkdir -p artifacts/security

      - name: Export locked dependencies
        run: uv export --frozen --no-emit-project --format requirements-txt --output-file artifacts/security/requirements.txt

      - name: Dependency vulnerability scan
        run: pip-audit --requirement artifacts/security/requirements.txt --format json --output artifacts/security/pip-audit.json

      - name: Generate SBOM
        run: cyclonedx-py environment --of JSON --output-file artifacts/security/sbom.json

      - name: Secret scan
        run: detect-secrets scan --all-files --exclude-files '(^|/)(.git|.venv|.cache|outputs)/' > artifacts/security/secrets.json

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-artifacts-${{ github.sha }}
          path: artifacts/security

  package:
    name: Build distributable package
    runs-on: ubuntu-latest
    needs: [test, release-contract]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install locked build environment
        run: |
          python -m pip install "uv==$UV_VERSION" twine
          uv sync --frozen --extra dev --python "$pythonLocation/bin/python"

      - name: Build wheel and source distribution
        run: uv build --wheel --sdist --out-dir dist

      - name: Validate package metadata
        run: twine check dist/*

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/clingrounder-wheel-smoke
          /tmp/clingrounder-wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/clingrounder-wheel-smoke/bin/python scripts/smoke_test_installed_wheel.py

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ github.sha }}
          path: dist/
          if-no-files-found: error
