name: Nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  full-public-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy src

      - name: Full public test suite
        run: python -m pytest -o addopts='' -m "not private and not model" tests
