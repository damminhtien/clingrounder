name: Nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

env:
  UV_VERSION: "0.11.31"

jobs:
  full-public-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install locked environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --extra dev --extra data --python "$pythonLocation/bin/python"

      - name: Ruff
        # INVARIANT: Execute the lock-synced environment without allowing
        # `uv run` to replace its Python from the local .python-version file.
        run: .venv/bin/ruff check .

      - name: Mypy
        run: .venv/bin/mypy src

      - name: Full public test suite
        run: .venv/bin/pytest -o addopts='' -m "not private and not model" tests
