name: Nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

env:
  UV_VERSION: "0.11.31"

jobs:
  full-public-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install locked environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --extra dev --extra data --python "$pythonLocation/bin/python"

      - name: Ruff
        run: uv run --frozen ruff check .

      - name: Mypy
        run: uv run --frozen mypy src

      - name: Full public test suite
        run: uv run --frozen pytest -o addopts='' -m "not private and not model" tests
