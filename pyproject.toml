[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-kg-nlp"
version = "0.1.0"
description = "Prototype for ontological reasoning in medical knowledge retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "medical-kg-nlp contributors"},
]
keywords = [
  "clinical-nlp",
  "entity-linking",
  "knowledge-graph",
  "medical-coding",
  "ontology",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7",
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]
data = [
  "duckdb>=1.0",
  "jsonlines>=4.0",
  "polars>=1.0",
  "pyarrow>=16.0",
]
retrieval = [
  "bm25s>=0.2",
  "faiss-cpu>=1.8",
  "rapidfuzz>=3.9",
]
vector-service = [
  "qdrant-client>=1.10",
]
graph = [
  "networkx>=3.3",
]
ml = [
  "accelerate>=0.30",
  "datasets>=2.19",
  "scikit-learn>=1.5",
  "tokenizers>=0.19",
  "torch>=2.3",
  "transformers>=4.41",
]
cli = [
  "rich>=13.7",
  "typer>=0.12",
]
api = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
]
experiment = [
  "hydra-core>=1.3",
  "mlflow>=2.14",
  "omegaconf>=2.3",
]
wandb = [
  "wandb>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
