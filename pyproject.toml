[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-kg-nlp"
version = "0.1.0"
description = "Prototype for ontological reasoning in medical knowledge retrieval"
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE"}
authors = [
  {name = "medical-kg-nlp contributors"},
]
keywords = [
  "clinical-nlp",
  "entity-linking",
  "knowledge-graph",
  "medical-coding",
  "ontology",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.13.4",
  "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=9.1.1",
  "ruff>=0.15.20",
  "mypy>=2.1.0",
  "types-PyYAML>=6.0.12.20260518",
]
data = [
  "duckdb>=1.5.4",
  "jsonlines>=4.0",
  "polars>=1.42.0",
  "pyarrow>=24.0.0",
]
retrieval = [
  "bm25s>=0.3.9",
  "faiss-cpu>=1.14.3",
  "rapidfuzz>=3.14.5",
]
vector-service = [
  "qdrant-client>=1.18.0",
]
graph = [
  "networkx>=3.6.1",
]
ml = [
  "accelerate>=1.14.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "datasets>=5.0.0",
  "scikit-learn>=1.9.0",
  "tokenizers>=0.22.2,<0.24.0",
  "torch>=2.12.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "transformers>=5.12.1",
]
cli = [
  "rich>=15.0.0",
  "typer>=0.25.1,<0.26.0",
]
api = [
  "fastapi>=0.138.2",
  "uvicorn>=0.49.0",
]
experiment = [
  "hydra-core>=1.3.3",
  "mlflow>=3.14.0",
  "omegaconf>=2.3.1",
]
wandb = [
  "wandb>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
