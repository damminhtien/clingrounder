[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "clingrounder"
version = "0.1.0a1"
description = "Offset-safe clinical text grounding to terminology-linked knowledge graphs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "ClinGrounder contributors"},
]

keywords = [
  "clinical-nlp",
  "entity-linking",
  "knowledge-graph",
  "medical-coding",
  "ontology",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

dependencies = [
  "pydantic>=2.13.4",
  "PyYAML>=6.0.3",
]

[project.scripts]
clingrounder = "clingrounder.cli:operational_main"
clingrounder-research = "clingrounder.cli:research_main"
clingrounder-benchmark = "clingrounder.cli:benchmark_main"

[project.optional-dependencies]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=9.1.1",
  "ruff>=0.15.20",
  "mypy>=2.1.0",
  "types-PyYAML>=6.0.12.20260518",
]
data = [
  "duckdb>=1.5.4",
  "fsspec>=2025.3.0",
  "ijson>=3.4.0",
  "jsonlines>=4.0",
  "polars>=1.42.0",
  "pyarrow>=24.0.0",
  "s3fs>=2025.3.0",
]
retrieval = [
  "bm25s>=0.3.9",
  "faiss-cpu>=1.14.3",
  "rapidfuzz>=3.14.5",
]
vector-service = [
  "qdrant-client>=1.18.0",
]
graph = [
  "networkx>=3.6.1",
]
ml = [
  "accelerate>=1.14.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "bitsandbytes>=0.49.1; sys_platform == 'linux'",
  "datasets>=5.0.0",
  "peft>=0.18.1",
  "scikit-learn>=1.9.0",
  "tokenizers>=0.22.2,<0.24.0",
  "torch>=2.12.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "transformers>=5.12.1",
]
cli = [
  "rich>=15.0.0",
  "typer>=0.25.1,<0.27.0",
]
api = [
  "fastapi>=0.138.2",
  "uvicorn>=0.49.0",
]
experiment = [
  "hydra-core>=1.3.3",
  "mlflow>=3.14.0",
  "omegaconf>=2.3.1",
]
wandb = [
  "wandb>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/damminhtien/clingrounder"
Repository = "https://github.com/damminhtien/clingrounder"
Issues = "https://github.com/damminhtien/clingrounder/issues"
Changelog = "https://github.com/damminhtien/clingrounder/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clingrounder = [
  "resources/*.jsonl",
  "benchmarks/phase1/resources/*.jsonl",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration and not release and not benchmark and not private and not model'"
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
  "integration: crosses package or process boundaries",
  "release: validates release artifacts or end-to-end submission flows",
  "benchmark: measures performance and may be machine-sensitive",
  "private: requires non-public corpora or licensed resources",
  "model: requires optional local model dependencies and cached weights",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
