candidate_generation:
  max_candidates: 20
  weights:
    exact: 1.0
    toneless: 0.92
    abbreviation: 0.92
    fuzzy: 0.72
    char_ngram: 0.62
    bm25: 0.50
  assignment_threshold: 0.75
  assignment_margin: 0.05

type_constraints:
  DRUG: ["RxNorm"]
  DISEASE: ["ICD-10", "UMLS", "SNOMED"]
  SYMPTOM: ["UMLS", "SNOMED", "LOCAL"]
  LAB_TEST: ["LOCAL"]
  LAB_RESULT: ["NONE", "LOCAL"]
  DOSAGE: ["NONE"]
  STRENGTH: ["NONE"]
  FREQUENCY: ["NONE"]
  ROUTE: ["NONE"]
  DURATION: ["NONE"]
  DOSAGE_FORM: ["NONE"]
  PROCEDURE: ["ICD-10", "UMLS", "SNOMED", "LOCAL"]
  FINDING: ["UMLS", "SNOMED", "LOCAL"]
