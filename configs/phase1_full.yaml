input_dir: data/raw/input
output_dir: phase1/full_output
zip: phase1/full_output.zip
run_root: outputs/phase1
run_label: phase1-full
mode: full
dictionary: data/standards/phase1_seed_tt06_rxnorm_controlled_concepts.jsonl
abbreviations: data/dictionaries/abbreviations.jsonl
strict_validation: true
expected_count: 100
max_candidates: 5
assertion_policy: pipeline
candidate_policy: pipeline

parallel:
  # Threads share the full dictionary and retrieval indexes instead of copying
  # them once per process worker.
  backend: thread
  workers: 4
  chunksize: 4
  fail_fast: true

pipeline:
  max_candidates: 20
  context_window: 80
  link_assignment_threshold: 0.75
  link_assignment_margin: 0.05
  link_candidate_threshold: 0.75
  link_candidate_relative_margin: 0.05
  link_max_qualified_candidates: 5
  # Source-specific values override type-specific values, which override the global threshold.
  link_candidate_thresholds_by_type: {}
  link_candidate_thresholds_by_source: {}
  candidate_sources:
    - exact
    - abbreviation
    - fuzzy
    - char_ngram
    - bm25
  enable_context: true
  enable_linking: true
  enable_candidate_reranking: true
  enable_entity_kg_validation: true
  enable_relations: false
  enable_relation_kg_validation: false
