schema_version: mined-recognition-promotion-policy.v1
policy_id: pmc-rare-cases-ccby-train-recognition-review-v1

# INVARIANT: only the frozen 42-document train inventory may produce proposals.
accepted_inventory_sha256:
  - 4e66b8487ce5bf9615128737b8731a024430eb8d833e32b14e767f0a94fb9878

# MODEL: these labels were produced by the local pipeline, not by article authors.
# LAB_RESULT and medication attributes stay out because repetition does not validate their spans.
source_label_types:
  DISEASE: DISEASE
  DRUG: DRUG
  LAB_TEST: LAB_TEST
  SYMPTOM: SYMPTOM

accepted_label_sources:
  - local_pipeline_prediction
accepted_review_tiers:
  - multi_document
min_occurrences: 2
min_documents: 2
allow_consensus_single_document: false
min_consensus_occurrences: 1
min_alias_characters: 3
max_alias_characters: 80
max_alias_tokens: 12
max_surface_variants: 8
allow_numeric_only: false

# Broad literature terms create high-volume false positives when scanned over clinical notes.
blocked_normalized_mentions:
  - cancer
  - daily
  - disease
  - infection
  - infectious disease
  - malignancy
  - normal
  - patient
  - syndrome
