schema_version: mined-recognition-promotion-policy.v1
policy_id: dailymed-human-rx-part6-2026-07-21-recognition-v1

# SOURCE DOSSIER: docs/mining-sources/dailymed.md
# INVARIANT: this fingerprint belongs to the train-only inventory from the frozen snapshot.
# Development records are benchmark inputs and cannot change this policy.
accepted_inventory_sha256:
  - 6ccca5638a5931ce41b37cccccf95260a5d36c9b1cf3e6d72c8006b5f19c5967

# Product, generic, and active-ingredient labels are independently meaningful drug mentions.
# Strength, route, and dosage form remain medication attributes; promoting them as DRUG would
# create type errors in clinical text such as "oral" or "tablet" without a drug anchor.
source_label_types:
  SPL_PRODUCT_NAME: DRUG
  SPL_GENERIC_NAME: DRUG
  SPL_ACTIVE_INGREDIENT: DRUG

accepted_label_sources:
  - source_structured_annotation
accepted_review_tiers:
  - multi_document

# SCALING: require evidence from two documents so a single SPL product cannot add a one-off alias.
min_occurrences: 2
min_documents: 2
allow_consensus_single_document: false
min_consensus_occurrences: 1
min_alias_characters: 3
max_alias_characters: 160
max_alias_tokens: 12
max_surface_variants: 12
allow_numeric_only: false
blocked_normalized_mentions: []
