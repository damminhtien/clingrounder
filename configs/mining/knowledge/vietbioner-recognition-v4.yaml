schema_version: mined-recognition-promotion-policy.v1
policy_id: vietbioner-19ba70a-recognition-v4

# SOURCE DOSSIER: docs/mining-sources/vietbioner.md
# INVARIANT: the inventory is generated only from the materialized v4 train split.
accepted_inventory_sha256:
  - d8b89bff924fd6b2f8ea189f10c50e6cb7064156cf933b330601897d9154a49b

# VietBioNER intentionally combines symptoms and diseases. Keep the broad source semantics;
# downstream clinical adapters must not infer a narrower patient-condition type from this source.
source_label_types:
  Symptom_and_Disease: FINDING
  DiagnosticProcedure: PROCEDURE

accepted_label_sources:
  - source_human_annotation
  - exact_duplicate_consensus
accepted_review_tiers:
  - multi_document
  - duplicate_consensus_supported

min_occurrences: 2
min_documents: 2
allow_consensus_single_document: true
min_consensus_occurrences: 1
min_alias_characters: 3
max_alias_characters: 160
max_alias_tokens: 16
max_surface_variants: 12
allow_numeric_only: false
blocked_normalized_mentions: []
