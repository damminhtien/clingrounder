schema_version: mined-recognition-promotion-policy.v1
policy_id: dailymed-human-rx-part6-2026-07-21-recognition-singletons-v1

# SOURCE DOSSIER: docs/mining-sources/dailymed.md
# INVARIANT: this inventory contains only the frozen train split, including singleton terms.
accepted_inventory_sha256:
  - ef4ae85ba99f47e09af2908d3a4ac820be24f1676186d5fa8b97f12c14fb7d8a

# DailyMed SPL fields are authoritative labels, so a train singleton may be evaluated as an
# ablation. This does not relax the semantic boundary around medication attributes.
source_label_types:
  SPL_PRODUCT_NAME: DRUG
  SPL_GENERIC_NAME: DRUG
  SPL_ACTIVE_INGREDIENT: DRUG

accepted_label_sources:
  - source_structured_annotation
accepted_review_tiers:
  - multi_document
  - repeated_single_document
  - singleton

min_occurrences: 1
min_documents: 1
allow_consensus_single_document: false
min_consensus_occurrences: 1
min_alias_characters: 3
max_alias_characters: 160
max_alias_tokens: 16
max_surface_variants: 12
allow_numeric_only: false
blocked_normalized_mentions: []
