schema_version: clingrounder.pipeline-profile
profile:
  id: vi-clinical-grounding-hybrid
  title: Vietnamese grounding hybrid baseline
  description: Lexical retrieval with deterministic reranking for the public synthetic pilot.
  maturity: benchmark
  portability: portable
  support_status: supported
  required_extras: [vi]
  tags: [benchmark, vietnamese, hybrid]
terminology:
  recognition_path: ../../../src/clingrounder/artifacts/packs/vi-clinical-small/seed_concepts.jsonl
  abbreviation_path: ../../../src/clingrounder/artifacts/packs/vi-clinical-small/abbreviations.jsonl
  alias_overlay_path: ../../../src/clingrounder/artifacts/packs/vi-clinical-small/vietnamese_medical_alias.jsonl
pipeline:
  version: vi-clinical-grounding-hybrid-0.1.0
  enable_context: true
  enable_linking: true
  enable_candidate_reranking: true
  enable_graph_evidence_reranking: false
  enable_entity_kg_validation: false
  enable_relations: false
  enable_relation_kg_validation: false
  max_candidates: 5
  candidate_sources: [exact, abbreviation]
