# MODEL: official XLM-R base checkpoint pinned to one immutable Hugging Face commit.
schema_version: token-classifier-run.v2
run_id: phase1-five-type-xlmr-base-2026-07-22
# INVARIANT: all data, output, and cache paths resolve from this movable repository root.
run_root: ../../../..

environment:
  # INVARIANT: the remote GPU job must resolve the exact dependency graph reviewed locally.
  lock_path: uv.lock
  lock_sha256: 6859c8b1aae41b98b7d5aeea9c11d174ae535927a8eb798846fd77a9f6f865b0

dataset:
  path: outputs/mining/model-datasets/phase1-manual-five-type-v1/spans.jsonl
  manifest: outputs/mining/model-datasets/phase1-manual-five-type-v1/manifest.json
  train_split: train
  evaluation_split: development

model:
  model_id: FacebookAI/xlm-roberta-base
  revision: e73636d4f797dec63c3081bb6ed5c7b0bb3f2089
  source_url: https://huggingface.co/FacebookAI/xlm-roberta-base
  license: MIT

# SCALING: batch 4 with accumulation 4 gives an effective batch of 16 while fitting a
# 16 GiB Ampere-or-newer GPU. Development remains the only model-selection split.
training:
  output_dir: outputs/models/phase1-five-type-xlmr-base-2026-07-22
  cache_dir: .cache/clingrounder/model-training
  max_length: 512
  stride: 64
  train_batch_size: 4
  evaluation_batch_size: 8
  gradient_accumulation_steps: 4
  epochs: 3.0
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.1
  preprocessing_workers: 4
  seed: 42
  full_determinism: true
  # MODEL: 10/2,112 exact raw spans cross an XLM-R subword boundary. Mask those tokens from
  # loss; never widen or rewrite the source annotation to fit the tokenizer.
  unaligned_span_policy: mask
  overwrite_output: false

runtime:
  operating_system: linux
  accelerator: cuda
  minimum_devices: 1
  minimum_vram_gib: 16
  minimum_compute_capability: [8, 0]
  precision: bf16
