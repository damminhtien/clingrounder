# MODEL: joint Vietnamese medical MLM and same-concept synonym contrastive pretraining.
schema_version: xlmr-dapt-run.v1
run_id: xlmr-joint-dapt-2026-07-29
run_root: ../../../..

environment:
  lock_path: uv.lock
  lock_sha256: 5730b64e36502433e921c0225d200c3cb3b6125aa0d418a6a20aee934cf577ba

model:
  model_id: FacebookAI/xlm-roberta-base
  revision: e73636d4f797dec63c3081bb6ed5c7b0bb3f2089
  source_url: https://huggingface.co/FacebookAI/xlm-roberta-base
  license: MIT

corpus:
  manifest: outputs/mining/model-datasets/xlmr-vietnamese-medical-dapt-2026-07-29/manifest.json

synonym_pairs:
  path: outputs/mining/model-datasets/xlmr-terminology-synonym-pairs-2026-07-29/pairs.jsonl
  manifest: outputs/mining/model-datasets/xlmr-terminology-synonym-pairs-2026-07-29/pairs.jsonl.manifest.json
  # INVARIANT: this exact allowlist proves that Round 2 cannot enter the
  # synonym-contrastive objective through a renamed or stale derived artifact.
  sources:
    - path: data/standards/icd10_vn/processed/tt06_icd10_concepts.jsonl
      sha256: 3598730336de5cba96ce030c09380a63e26055e87b0bde189e0064c8fa6f5e51
    - path: data/standards/rxnorm/processed/rxnorm_full_07062026_concepts.jsonl
      sha256: 42faaadeb12222ec099f05c398f3ff858866cb694cbb6dc0cb193f0ea23359cb
    - path: data/standards/vn_clinical_lexicon/processed/vn_clinical_lexicon_concepts.jsonl
      sha256: 8a9416031cab473c9c410f0f740adc57d82f6feb21ca1a2bd7fa1145d16b5105

training:
  output_dir: outputs/models/xlmr-joint-dapt-2026-07-29
  cache_dir: .cache/clingrounder/model-training
  max_length: 256
  mlm_probability: 0.15
  mlm_batch_size: 8
  contrastive_batch_size: 16
  contrastive_weight: 0.2
  contrastive_temperature: 0.05
  max_steps: 10000
  gradient_accumulation_steps: 2
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_ratio: 0.06
  seed: 42
  checkpoint_interval: 1000
  preprocessing_workers: 4
  local_files_only: true

runtime:
  operating_system: linux
  accelerator: cuda
  minimum_devices: 1
  # MODEL: 24 GB-class RTX 4090 devices report about 23.5 GiB through CUDA.
  minimum_vram_gib: 23
  minimum_compute_capability: [8, 0]
  precision: bf16
