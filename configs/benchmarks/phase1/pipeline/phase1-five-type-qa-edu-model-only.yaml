# Development calibration profile for the Q&A/educational-adapted token classifier.
terminology:
  # PipelineFactory requires a recognition repository, but model-only extraction never queries it.
  recognition_path: ../../../../data/standards/phase1_seed_tt06_rxnorm_controlled_concepts.jsonl
  abbreviation_path: ../../../../data/dictionaries/abbreviations.jsonl
  alias_overlay_path: null
  reviewed_mention_path: null

pipeline:
  version: "0.2.0-phase1-five-type-qa-edu-model-only"
  # INVARIANT: calibration measures raw NER output without context, linking, relation, or KG edits.
  enable_context: false
  enable_linking: false
  enable_candidate_reranking: false
  enable_graph_evidence_reranking: false
  enable_entity_kg_validation: false
  enable_relations: false
  enable_relation_kg_validation: false
  candidate_sources: [exact]

models:
  entity_extractor:
    # MODEL: the run spec pins the authorized dataset, model revision, lock, and GPU provenance.
    run_spec: ../models/phase1-five-type-xlmr-qa-edu-2026-07-26.yaml
    model_id: ../../../../outputs/models/phase1-five-type-xlmr-qa-edu-2026-07-26/final-model
    revision: e73636d4f797dec63c3081bb6ed5c7b0bb3f2089
    device: cpu
    batch_size: 4
    max_length: 512
    stride: 64
    default_confidence_threshold: 0.0
    confidence_thresholds: {}
    combine_with_dictionary: false
