terminology:
  # Recognition stays in memory because the matcher scans every note. The additional source is
  # code-free, train-mined knowledge that passed the frozen holdout gate in run a147402078e0.
  # Reviewed alternate types remain ambiguous until the contextual type resolver sees a
  # section or medication-indication cue.
  recognition_path: ../../../../data/standards/phase1_seed_tt06_rxnorm_controlled_concepts.jsonl
  additional_recognition_paths:
    - ../../../../outputs/mining/knowledge/phase1-recognition-a147402078e0/recognition_concepts.jsonl
  # Short aliases are emitted only when the raw document structure supplies a reviewed context
  # gate; the artifact contains no document IDs or absolute offsets.
  contextual_alias_path: ../../../../outputs/mining/knowledge/phase1-recognition-a147402078e0/contextual_alias_rules.yaml
  abbreviation_path: ../../../../data/dictionaries/abbreviations.jsonl
  alias_overlay_path: ../../../../data/dictionaries/vietnamese_medical_alias.jsonl

pipeline:
  version: "0.2.0-rule-ner-mined-recognition"
  enable_context: false
  enable_linking: false
  enable_candidate_reranking: false
  enable_entity_kg_validation: false
  enable_relations: false
  enable_relation_kg_validation: false
