# Historical benchmark experiment. The stable Phase 1 CLI accepts only empty or pipeline export;
# use the benchmark package API to reproduce this reviewed/calibrated selective policy.
input_dir: data/raw/input
output_dir: phase1/selective_candidates/output
zip: phase1/selective_candidates/output.zip
run_root: outputs/phase1
run_label: phase1_selective_candidates
traces: phase1/selective_candidates/traces.jsonl
mode: selective
dictionary: data/standards/phase1_seed_tt06_rxnorm_controlled_concepts.jsonl
abbreviations: data/dictionaries/abbreviations.jsonl
strict_validation: true
expected_count: 100
max_candidates: 1
assertion_policy: selective
candidate_policy: selective

selective:
  assertions:
    allowed_scopes:
      - left
      - right
      - section_prior
    min_evidence: 1
    require_calibrated_evidence: true
    calibrated_evidence_map: data/manual_gold/calibrated_assertion_evidence.jsonl
    allowed_types:
      isNegated:
        - TRIỆU_CHỨNG
        - CHẨN_ĐOÁN
        - THUỐC
      isFamily: []
      isHistorical:
        - CHẨN_ĐOÁN
        - THUỐC
  candidates:
    enabled: true
    reviewed_map: data/manual_gold/reviewed_candidate_map.jsonl
    source_thresholds:
      ICD-10:
        dictionary_exact: 0.99505
      RxNorm:
        dictionary_exact: 0.989362
    require_reviewed: true
    rxnorm_require_structured_mention: false

parallel:
  backend: process
  workers: 4
  chunksize: 4
  fail_fast: true

pipeline:
  max_candidates: 20
  context_window: 80
  candidate_sources:
    - exact
  link_emit_probabilities_by_source:
    "ICD-10:dictionary_exact": 0.99505
    "RxNorm:dictionary_exact": 0.989362
  enable_context: true
  enable_linking: false
  enable_candidate_reranking: false
  enable_entity_kg_validation: false
  enable_relations: false
  enable_relation_kg_validation: false
