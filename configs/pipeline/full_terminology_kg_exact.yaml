terminology:
  # Recognition remains compact; the graph is a constrained normalization retriever only.
  recognition_path: data/standards/phase1_seed_tt06_rxnorm_controlled_concepts.jsonl
  abbreviation_path: data/dictionaries/abbreviations.jsonl
  alias_overlay_path: data/dictionaries/vietnamese_medical_alias.jsonl
  normalization_paths:
    - data/standards/icd10_vn/processed/tt06_icd10_concepts.jsonl
    - data/standards/rxnorm/processed/rxnorm_full_07062026_concepts.jsonl
  normalization_alias_overlay_paths:
    - outputs/mining/knowledge/dailymed-rxnorm-2026-07-17/alias_overlay.jsonl
    - outputs/mining/knowledge/codiesp-icd10-2026-07-18/alias_overlay.jsonl
  normalization_index_path: .cache/medical-kg/terminology/terminology-a2d5a19e83fbc9e1a305.sqlite3
  knowledge_graph_index_path: .cache/medical-kg/knowledge-graph/knowledge-graph-668ddc869e58db0583c0.sqlite3

pipeline:
  version: "0.2.0-full-terminology-kg-exact"
  enable_context: true
  enable_linking: true
  enable_candidate_reranking: true
  enable_entity_kg_validation: true
  enable_relations: false
  enable_relation_kg_validation: false
  max_candidates: 20
  # kg_exact is exact/toneless and type/code-system filtered; it does not use FTS.
  candidate_sources: [exact, abbreviation, fuzzy, char_ngram, bm25, kg_exact]
